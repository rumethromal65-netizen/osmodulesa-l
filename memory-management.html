<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Mapping Simulator | OS Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        .nav-links { display: none; }
        @media (min-width: 1024px) {
            .nav-links { display: flex; flex-wrap: wrap; justify-content: flex-end; }
        }
        .flow-line {
            stroke: var(--accent-camel);
            stroke-width: 4;
            fill: none;
            stroke-dasharray: 10;
            animation: dash 1s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .flow-line.active {
            opacity: 1;
        }
        @keyframes dash {
            to { stroke-dashoffset: -20; }
        }
        .node-highlight {
            box-shadow: 0 0 20px var(--accent-camel);
            border-color: var(--accent-camel);
            transform: scale(1.05);
        }
        .ram-block {
            transition: all 0.3s;
        }
        .ram-block.active {
            background-color: var(--accent-camel);
            color: white;
            font-weight: bold;
            transform: scale(1.05);
        }
    </style>
</head>
<body class="">
    
        <!-- Top Bar -->
    <nav class="top-bar">
        <a href="index.html" class="back-home-btn">← Back to Home</a>
    </nav>

    <main class="flex-grow flex flex-col p-6 max-w-6xl mx-auto w-full animate-fade-in">
        <header class="mb-8">
            <h1 class="text-4xl mb-2">Memory Management Architecture</h1>
            <p class="text-[var(--text-lo)]">Simulate the hardware data flow: translating a Logical Address to a Physical Address via the MMU.</p>
        </header>

        <div class="glass-panel p-6 mb-8 flex flex-col md:flex-row gap-4 items-end">
            <div class="flex-grow">
                <label class="block text-sm font-semibold mb-1 text-[var(--text-lo)]">Logical Address (e.g. 346)</label>
                <input type="number" id="logical-input" value="346" min="0" class="w-full">
            </div>
            <div class="flex-grow">
                <label class="block text-sm font-semibold mb-1 text-[var(--text-lo)]">Relocation Register (e.g. 14000)</label>
                <input type="number" id="relocation-input" value="14000" min="0" class="w-full">
            </div>
            <button id="translate-btn" class="btn-accent">Translate Address</button>
            <button id="reset-btn" class="btn-ghost">Reset</button>
        </div>

        <div class="relative w-full h-[600px] glass-panel bg-[var(--bg-level2)]/50 overflow-hidden" id="diagram-area">
            
            <!-- SVG Lines -->
            <svg class="absolute inset-0 w-full h-full pointer-events-none z-0">
                <path id="line-cpu-mmu" class="flow-line" d="M 250 200 L 400 200" />
                <path id="line-reloc-mmu" class="flow-line" d="M 450 350 L 450 280" />
                <path id="line-mmu-mar" class="flow-line" d="M 500 200 L 550 200" />
                <path id="line-mar-ram" class="flow-line" d="M 650 200 L 750 200" />
            </svg>

            <!-- CPU -->
            <div id="node-cpu" class="absolute left-[50px] top-[100px] w-[200px] h-[200px] border-4 border-[var(--text-main)] rounded-2xl bg-[var(--sand-warm)] z-10 flex flex-col items-center p-4 transition-all duration-300">
                <h3 class="text-xl mb-4 text-[var(--text-main)]">CPU</h3>
                <div class="bg-[var(--bg-level2)] border-2 border-[var(--accent-camel)] p-2 rounded w-full text-center mb-2">
                    <span class="text-xs font-bold text-[var(--text-lo)] block">Logical Address</span>
                    <span id="display-logical" class="mono font-bold text-lg">---</span>
                </div>
            </div>

            <!-- MMU -->
            <div id="node-mmu" class="absolute left-[400px] top-[50px] w-[300px] h-[400px] border-4 border-[var(--accent-sage)] rounded-2xl bg-[var(--sand-bg)] z-10 flex flex-col items-center p-4 transition-all duration-300">
                <h3 class="text-xl mb-2 text-[var(--accent-camel)]">Memory Management Unit</h3>
                
                <div class="flex-grow w-full flex flex-col items-center justify-center relative">
                    <!-- Adder -->
                    <div id="node-adder" class="w-16 h-16 rounded-full bg-[var(--accent-sage)] border-2 border-[var(--accent-sage)] flex items-center justify-center text-2xl font-bold z-20 transition-all duration-300 mb-8 mt-12">
                        +
                    </div>
                    
                    <!-- MAR -->
                    <div id="node-mar" class="bg-[var(--bg-level2)] border-2 border-[var(--accent-camel)] p-2 rounded w-full text-center transition-all duration-300">
                        <span class="text-xs font-bold text-[var(--text-lo)] block">MAR (Memory Address Register)</span>
                        <span id="display-mar" class="mono font-bold text-lg">---</span>
                    </div>

                    <!-- Relocation Register -->
                    <div id="node-reloc" class="absolute bottom-4 bg-[var(--bg-level2)] border-2 border-[var(--accent-camel)] p-2 rounded w-full text-center transition-all duration-300">
                        <span class="text-xs font-bold text-[var(--text-lo)] block">Relocation Register</span>
                        <span id="display-reloc" class="mono font-bold text-lg">---</span>
                    </div>
                </div>
            </div>

            <!-- RAM (Physical Memory) -->
            <div id="node-ram" class="absolute left-[750px] top-[50px] w-[200px] h-[500px] border-4 border-[var(--accent-camel)] rounded-lg bg-[var(--bg-level2)] z-10 flex flex-col transition-all duration-300 overflow-hidden">
                <h3 class="text-center py-2 bg-[var(--accent-camel)] text-white font-bold tracking-wider">PHYSICAL RAM</h3>
                <div class="flex-grow flex flex-col" id="ram-blocks">
                    <!-- Blocks dynamically populated -->
                </div>
            </div>
            
            <!-- Floating math popup -->
            <div id="math-popup" class="absolute left-[470px] top-[140px] bg-[var(--bg-level3)] text-[var(--yellow)] p-3 rounded-lg font-bold mono z-30 opacity-0 transition-opacity duration-300 shadow-xl pointer-events-none transform -translate-x-1/2 border border-[var(--border-mid)]">
                <span id="math-text"></span>
            </div>

            <!-- Status -->
            <div id="anim-status" class="absolute bottom-6 left-6 text-black font-bold bg-[var(--yellow)] px-4 py-2 rounded-lg opacity-0 transition-opacity">
                Initializing...
            </div>
        </div>
    </main>

    <script src="memory-management.js"></script>
</body>
</html>
