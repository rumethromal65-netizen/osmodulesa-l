<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Process States | OS Visualizer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="theme.css">
    <style>
        /* Node positions */
        #node-new        { top: 90px;  left: 40px;  }
        #node-ready      { top: 90px;  left: 290px; }
        #node-running    { top: 90px;  left: 580px; }
        #node-waiting    { top: 250px; left: 440px; }
        #node-terminated { top: 90px;  left: 840px; }
        #node-suspend-ready { top: 440px; left: 290px; }
        #node-suspend-wait  { top: 440px; left: 440px; }

        .ram-zone {
            position: absolute; top: 0; left: 0; right: 0; height: 370px;
            background: rgba(250,204,21,0.03);
            border-bottom: 1.5px dashed rgba(250,204,21,0.25);
            z-index: 1;
        }
        .disk-zone {
            position: absolute; top: 370px; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.02);
            z-index: 1;
        }
        .zone-label {
            position: absolute; top: 10px; left: 14px;
            font-weight: 700; font-size: 0.7rem;
            color: var(--text-lo);
            font-family: 'JetBrains Mono', monospace;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .connection-line {
            stroke: rgba(255,255,255,0.15);
            stroke-width: 2.5;
            fill: none;
            marker-end: url(#arrow);
        }
        .connection-line-dual {
            stroke: rgba(255,255,255,0.12);
            stroke-width: 2;
            fill: none;
            marker-start: url(#arrow-start);
            marker-end: url(#arrow);
        }

        #process-token {
            position: absolute;
            width: 38px; height: 38px;
            background: var(--grad-btn);
            border-radius: 50%;
            z-index: 20;
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex; align-items: center; justify-content: center;
            color: #000;
            font-weight: 800;
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
            box-shadow: 0 4px 16px var(--yellow-glow);
            pointer-events: none;
            opacity: 0;
        }

        #status-text {
            position: absolute; bottom: 12px; right: 16px;
            font-weight: 600; font-size: 0.85rem;
            color: var(--text-mid);
            font-family: 'JetBrains Mono', monospace;
            background: rgba(13,13,18,0.85);
            backdrop-filter: blur(8px);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            border: 1px solid var(--border-lo);
            z-index: 20;
        }

        .btn-row-sep {
            width: 100%; height: 1px;
            background: var(--border-lo);
            margin: 0.25rem 0;
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <nav class="top-bar">
        <a href="index.html" class="back-home-btn">← Back to Home</a>
    </nav>

    <main class="flex-grow flex flex-col p-6 max-w-[1280px] mx-auto w-full animate-fade-in" style="gap:1.25rem">

        <!-- Header -->
        <div class="section-header">
            <h1>Advanced 7-State Process Model</h1>
            <p>Visualize a process transitioning through RAM and Virtual Memory (Swapping).</p>
        </div>

        <!-- Controls -->
        <div class="glass-panel p-4 flex flex-wrap gap-2 items-center justify-center text-sm">
            <button id="btn-admit"    class="btn-primary">Admit (New → Ready)</button>
            <button id="btn-dispatch" class="btn-primary" disabled>Dispatch (Ready → Run)</button>
            <button id="btn-interrupt" class="btn-accent" disabled>Interrupt (Run → Ready)</button>
            <button id="btn-iowait"   class="btn-primary" disabled>I/O Request (Run → Wait)</button>
            <button id="btn-ioevent"  class="btn-primary" disabled>I/O Event (Wait → Ready)</button>
            <button id="btn-exit"     class="btn-primary" disabled>Exit (Run → Term)</button>
            <div class="btn-row-sep"></div>
            <button id="btn-suspend-wait"   class="btn-accent" disabled>Suspend (Wait → S.Wait)</button>
            <button id="btn-resume-wait"    class="btn-accent" disabled>Resume (S.Wait → Wait)</button>
            <button id="btn-suspend-ready"  class="btn-accent" disabled>Suspend (Ready → S.Ready)</button>
            <button id="btn-resume-ready"   class="btn-accent" disabled>Resume (S.Ready → Ready)</button>
            <button id="btn-ioevent-disk"   class="btn-primary" disabled>I/O Event (S.Wait → S.Ready)</button>
            <button id="btn-reset" class="btn-ghost ml-auto">Reset</button>
        </div>

        <!-- Canvas -->
        <div class="glass-panel relative overflow-hidden" style="width:100%;height:600px">
            <div class="ram-zone"><div class="zone-label">Main Memory (RAM)</div></div>
            <div class="disk-zone"><div class="zone-label" style="top:auto;bottom:12px">Virtual Memory (Disk)</div></div>

            <svg class="absolute inset-0 w-full h-full pointer-events-none z-0" style="min-width:1040px">
                <defs>
                    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                        <polygon points="0 0, 8 3, 0 6" fill="rgba(255,255,255,0.3)"/>
                    </marker>
                    <marker id="arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto">
                        <polygon points="8 0, 0 3, 8 6" fill="rgba(255,255,255,0.3)"/>
                    </marker>
                </defs>
                <!-- New → Ready -->
                <path class="connection-line" d="M 180 125 L 280 125"/>
                <!-- Ready → Running -->
                <path class="connection-line" d="M 430 115 L 570 115"/>
                <!-- Running → Ready (Interrupt) -->
                <path class="connection-line" d="M 570 140 L 430 140"/>
                <!-- Running → Waiting -->
                <path class="connection-line" d="M 650 165 L 510 255"/>
                <!-- Waiting → Ready -->
                <path class="connection-line" d="M 440 268 L 360 165"/>
                <!-- Running → Terminated -->
                <path class="connection-line" d="M 720 125 L 830 125"/>
                <!-- Swap lines -->
                <path class="connection-line-dual" d="M 510 310 L 510 430"/>
                <path class="connection-line-dual" d="M 360 165 L 360 430"/>
                <path class="connection-line" d="M 440 475 L 380 475"/>
            </svg>

            <!-- State Nodes -->
            <div id="node-new"          class="state-node">NEW</div>
            <div id="node-ready"        class="state-node">READY</div>
            <div id="node-running"      class="state-node">RUNNING</div>
            <div id="node-waiting"      class="state-node">WAITING<br><span style="font-size:11px;opacity:0.7">(Blocked)</span></div>
            <div id="node-terminated"   class="state-node">TERMINATED</div>
            <div id="node-suspend-ready" class="state-node">SUSPEND<br>READY</div>
            <div id="node-suspend-wait"  class="state-node">SUSPEND<br>WAIT</div>

            <!-- Token -->
            <div id="process-token">P1</div>
            <div id="status-text">Ready to admit.</div>
        </div>
    </main>

    <script src="adv-states.js"></script>
</body>
</html>
